server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # A missing build file must be a 404, not the app page.
    location /static/ {
        try_files $uri =404;
    }

    location /assets/ {
        try_files $uri =404;
    }

    # Client-side routes such as /client are handled by the app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
